name: Le Collectionist
description: 'Le Collectionist is a French luxury travel and villa-rental marketplace
  that curates high-end vacation homes and provides concierge services for guests,
  alongside a revenue-management offering for property owners and a commission-based
  referral program for travel agencies. Surfaced as a portfolio company of Partech
  and added to the API Evangelist network, the company operates a consumer booking
  website, an owner portal, and a travel magazine, but publishes no public developer
  API, developer portal, or programmatic partner integration at this time. Sector:
  Marketplace / Travel & Hospitality.'
